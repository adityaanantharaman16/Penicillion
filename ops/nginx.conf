worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 4096; }
http {
  access_log off;
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
  upstream game { server 127.0.0.1:4321; keepalive 32; }
  server {
    listen 8080;
    client_max_body_size 3k;
    client_header_timeout 8s;
    client_body_timeout 10s;
    # Concrete VPC design: these two private ranges belong to the two ALB subnets.
    set_real_ip_from 10.60.0.0/24;
    set_real_ip_from 10.60.1.0/24;
    real_ip_header CloudFront-Viewer-Address;
    location / {
      proxy_http_version 1.1;
      proxy_pass http://game;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 90s;
    }
  }
}
