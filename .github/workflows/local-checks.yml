name: Game verification

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: game-verification-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Test game and release images
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: penicillion-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start the local game with isolated PostgreSQL and Redis
        run: npm run bootstrap
      - name: Run game, content, recovery and concept tests
        run: npm test
      - name: Build the ARM64 game and ingress images
        run: |
          docker build --platform linux/arm64 --target production --tag "penicillion-game:$GITHUB_SHA" .
          docker build --platform linux/arm64 --target ingress --tag "penicillion-edge:$GITHUB_SHA" .
          docker run --rm "penicillion-edge:$GITHUB_SHA" -t
      - name: Exercise the packaged pair with disposable local settings
        run: |
          # Let only the packaged worker advance room timers in this database.
          docker compose --profile play stop worker-one worker-two
          docker run --detach --name ci-game --network "${COMPOSE_PROJECT_NAME}_default" \
            --publish 127.0.0.1:18080:8080 \
            --env NODE_ENV=test --env PUBLIC_ORIGIN=http://127.0.0.1:18080 \
            --env DATABASE_URL=postgresql://night_play:local-play-only@db:5432/penicillion \
            --env REDIS_URL=redis://cache:6379 --env CACHE_NAMESPACE=packaged-smoke: \
            "penicillion-game:$GITHUB_SHA"
          docker run --detach --name ci-edge --network container:ci-game "penicillion-edge:$GITHUB_SHA"
          curl --fail --silent --show-error --retry-all-errors --retry 15 --retry-delay 1 \
            http://127.0.0.1:18080/health/ready
      - name: Play Daily, Practice and multiplayer Relay in Chromium
        env:
          TEST_ORIGIN: http://127.0.0.1:18080
        run: |
          npm exec -- playwright-core install --with-deps --only-shell chromium
          npm run test:browser
      - name: Package the tested images and calculate their checksum
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p "$RUNNER_TEMP/delivery"
          cd "$RUNNER_TEMP/delivery"
          docker save "penicillion-game:$GITHUB_SHA" "penicillion-edge:$GITHUB_SHA" | gzip -1 > penicillion-linux-arm64.tar.gz
          sha256sum penicillion-linux-arm64.tar.gz > SHA256SUMS
      - name: Store the release candidate
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: penicillion-linux-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/delivery/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose --profile play logs --no-color --tail 80
          for service in ci-game ci-edge; do
            if docker container inspect "$service" >/dev/null 2>&1; then docker logs --tail 80 "$service"; fi
          done

  draft-release:
    name: Attach tested images to a draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: penicillion-linux-arm64-${{ github.sha }}
          path: delivery
      - name: Verify and attach the archive to the version tag
        working-directory: delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check SHA256SUMS
          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "The release is already published." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber penicillion-linux-arm64.tar.gz SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes \
              --title "Penicillion $GITHUB_REF_NAME" penicillion-linux-arm64.tar.gz SHA256SUMS
          fi

  amd64:
    name: Build and rehearse Droplet image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build native production image and test it behind HTTPS
        env:
          CONFIG_DIR: ${{ runner.temp }}/rehearsal
          COMPOSE_PROJECT_NAME: release-test
        run: |
          export GAME_IMAGE="penicillion-game:${GITHUB_SHA}-amd64"
          docker build --platform linux/amd64 --target production \
            --build-arg RELEASE_REVISION="$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$GAME_IMAGE" .
          cd ops/droplet
          ./init-config.sh "$CONFIG_DIR" --rehearsal
          docker compose up -d --wait db cache
          docker compose run --rm -T admin
          docker compose up -d --wait game
          curl -fsS --connect-to penicillion.io:443:127.0.0.1:8443 \
            --cacert "$CONFIG_DIR/ca.crt" https://penicillion.io/health/ready |
            jq -e --arg sha "$GITHUB_SHA" '.ready and .revision == $sha'
      - name: Package the rehearsed image
        id: package
        run: |
          mkdir -p "$RUNNER_TEMP/amd64"
          tag="penicillion-game:${GITHUB_SHA}-amd64"
          archive="$RUNNER_TEMP/amd64/game.tar.gz"
          docker save "$tag" | gzip -1 > "$archive"
          echo "archive=$(sha256sum "$archive" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "image=$(docker image inspect -f '{{.Id}}' "$tag")" >> "$GITHUB_OUTPUT"
          echo "host=$(ops/release/contract.sh host ops/droplet | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Rehearse signed promotion, rejected signature and failed-health rollback
        run: |
          sudo env GITHUB_SHA="$GITHUB_SHA" RUNNER_TEMP="$RUNNER_TEMP" \
            CONFIG_DIR="$RUNNER_TEMP/rehearsal" COMPOSE_PROJECT_NAME=release-test \
            bash scripts/ci/rehearse-promotion.sh
      - name: Store the AMD64 candidate
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: droplet-amd64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/amd64/game.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
      archive: ${{ steps.package.outputs.archive }}
      image: ${{ steps.package.outputs.image }}
      host: ${{ steps.package.outputs.host }}

  deploy:
    name: Approve release to penicillion.io
    needs: amd64
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://penicillion.io
    concurrency:
      group: droplet-deployment
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Sign this run's verified image for the Droplet
        env:
          SIGNING_KEY: ${{ secrets.DROPLET_SIGNING_KEY }}
          ARTIFACT: ${{ needs.amd64.outputs.artifact }}
          ARCHIVE: ${{ needs.amd64.outputs.archive }}
          IMAGE: ${{ needs.amd64.outputs.image }}
          HOST_CONTRACT: ${{ needs.amd64.outputs.host }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/approval"
          mkdir "$dir"
          printf '%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ID" "$ARTIFACT" \
            "$ARCHIVE" "$IMAGE" "$HOST_CONTRACT" "$(($(date +%s) + 600))" > "$dir/release"
          openssl pkeyutl -sign -rawin -inkey <(printf '%s\n' "$SIGNING_KEY") \
            -in "$dir/release" -out "$dir/release.sig"
      - name: Deliver signed approval
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: droplet-approved
          path: ${{ runner.temp }}/approval/
          retention-days: 1
          overwrite: true
      - name: Verify the deployed revision over public HTTPS
        run: |
          for attempt in {1..60}; do
            if curl -fsS --max-time 4 https://penicillion.io/health/ready |
              jq -e --arg sha "$GITHUB_SHA" '.ready and .revision == $sha' >/dev/null; then
              echo "Healthy at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Revision was not observed. Check journalctl -u penicillion-release on the Droplet."
          exit 1
